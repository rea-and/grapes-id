# Template: `./deploy.sh --setup <domain>` fills in __DOMAIN__, __API_PORT__ and __LOGIN_PORT__ and installs it as
# /etc/apache2/sites-available/grapesid.conf. certbot then copies it into an :443 site and adds the HTTP -> HTTPS redirect.
#
# Plain HTTP/1.1 proxying on purpose: this server runs mpm_prefork (PHP), which can't do HTTP/2. Browsers, the console,
# OIDC and the REST APIs all work over HTTP/1.1; only native gRPC clients would need h2c end to end.
<VirtualHost *:80>
    ServerName __DOMAIN__

    # Sign-in branding (installed by deploy/brand.sh; ignored until it exists). Must stay above the ProxyPass lines.
    IncludeOptional /etc/apache2/grapesid-brand.inc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    # Zitadel decides http/https for its own URLs from this header (ZITADEL_EXTERNALSECURE must match).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Sign-in pages (Zitadel Login V2 container)
    ProxyPass        /ui/v2/login http://127.0.0.1:__LOGIN_PORT__/ui/v2/login
    ProxyPassReverse /ui/v2/login http://127.0.0.1:__LOGIN_PORT__/ui/v2/login

    # Everything else: OIDC endpoints, admin console (/ui/console), APIs
    ProxyPass        / http://127.0.0.1:__API_PORT__/
    ProxyPassReverse / http://127.0.0.1:__API_PORT__/

    # Long-polling/streaming console calls
    ProxyTimeout 300

    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    ErrorLog ${APACHE_LOG_DIR}/grapesid_error.log
    CustomLog ${APACHE_LOG_DIR}/grapesid_access.log combined
</VirtualHost>
